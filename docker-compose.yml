services:
  # Express API Server
  server:
    build: ./server
    restart: always
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_URL: https://sarndtservices.com

  # React Client (built & served by nginx)
  client:
    build:
      context: ./client
      args:
        VITE_BASE_URL: https://sarndtservices.com/api
        VITE_GOOGLE_CLIENT_ID: 320295330330-cnmpi71hghehrhge8v4bg2v7f24gnu6v.apps.googleusercontent.com
        VITE_WA_NUMBER: 628129258446
        VITE_HERO_VIDEO_URL: /videos/3987526-hd_1920_1080_25fps.mp4
    restart: always

  # Nginx Reverse Proxy (SSL handled by Cloudflare)
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server
      - client

volumes: {}
