<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Test - Cross Browser Compatibility</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            height: 70vh;
            overflow: hidden;
            border-radius: 12px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 8px;
        }
        .browser-info {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .test-results {
            background: rgba(0,255,0,0.1);
            border: 1px solid rgba(0,255,0,0.3);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Video Compatibility Test</h1>

    <div class="browser-info">
        <h3>Browser Information:</h3>
        <p id="browser-info"></p>
    </div>

    <div class="video-container">
        <video id="test-video" autoplay muted loop playsinline poster="/video-poster.jpg">
            <source src="/videos/3987526-hd_1920_1080_25fps.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="overlay">
            <h2>Video Background Test</h2>
            <p>If you can see this, the video is loading</p>
        </div>
    </div>

    <div id="test-results">
        <h3>Test Results:</h3>
        <div id="results"></div>
    </div>

    <script>
        // Browser detection
        const userAgent = navigator.userAgent;
        let browserInfo = 'Unknown Browser';

        if (userAgent.indexOf('Chrome') > -1) {
            browserInfo = 'Google Chrome';
        } else if (userAgent.indexOf('Safari') > -1) {
            browserInfo = 'Safari';
        } else if (userAgent.indexOf('Firefox') > -1) {
            browserInfo = 'Mozilla Firefox';
        } else if (userAgent.indexOf('Edge') > -1) {
            browserInfo = 'Microsoft Edge';
        }

        document.getElementById('browser-info').innerHTML = `
            <strong>Browser:</strong> ${browserInfo}<br>
            <strong>User Agent:</strong> ${userAgent.substring(0, 100)}...
        `;

        // Video testing
        const video = document.getElementById('test-video');
        const results = document.getElementById('results');

        function addResult(test, passed, message) {
            const div = document.createElement('div');
            div.className = passed ? 'test-results' : 'test-results error';
            div.innerHTML = `<strong>${test}:</strong> ${passed ? '✅ PASS' : '❌ FAIL'} - ${message}`;
            results.appendChild(div);
        }

        // Test video loading
        video.addEventListener('loadstart', () => {
            addResult('Video Load Start', true, 'Loading started');
        });

        video.addEventListener('loadedmetadata', () => {
            addResult('Video Metadata', true, `Duration: ${video.duration}s, Dimensions: ${video.videoWidth}x${video.videoHeight}`);
        });

        video.addEventListener('canplay', () => {
            addResult('Video Can Play', true, 'Video can be played');
        });

        video.addEventListener('error', (e) => {
            addResult('Video Error', false, `Error: ${e.message || 'Unknown error'}`);
        });

        // Test autoplay
        setTimeout(() => {
            const isPlaying = video.currentTime > 0 && !video.paused && !video.ended;
            addResult('Autoplay', isPlaying, isPlaying ? 'Video is autoplaying' : 'Autoplay may be blocked');
        }, 2000);

        // Test responsive behavior
        function testResponsive() {
            const container = document.querySelector('.video-container');
            const isResponsive = container.offsetWidth > 0;
            addResult('Responsive Design', isResponsive, `Container width: ${container.offsetWidth}px`);
        }

        testResponsive();
        window.addEventListener('resize', testResponsive);
    </script>
</body>
</html>
